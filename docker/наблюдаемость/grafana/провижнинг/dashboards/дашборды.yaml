# Откуда Grafana берёт дашборды стенда. Правится только файл на диске: правку в UI
# провижнинг вернёт назад при следующем обходе каталога.

apiVersion: 1

providers:
  - name: Стенд OpenHub
    orgId: 1
    folder: OpenHub
    type: file
    disableDeletion: false
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
