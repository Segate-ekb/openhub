# Loki — хранилище логов. Один процесс, файловое хранилище, без кольца и без кэшей.

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: info

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 100

schema_config:
  configs:
    # v13 + tsdb — обязательное условие structured metadata, а без неё OTLP-логи
    # приезжают без trace_id: Loki кладёт его именно туда, а не в тело строки.
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  allow_structured_metadata: true
  volume_enabled: true
  # Стенд шлёт логи руками (curl), в том числе задним числом относительно трассы.
  reject_old_samples: false
  # Те же сутки, что держит Tempo: строка не должна переживать трассу, на которую
  # она ссылается, иначе переход из лога ведёт в пустоту.
  retention_period: 24h

# Само по себе retention_period ничего не удаляет: чистку делает компактор,
# и только когда она ему разрешена.
compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

analytics:
  reporting_enabled: false
