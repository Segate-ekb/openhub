# Tempo — хранилище трасс и генератор RED-метрик из них.
#
# Один процесс во всех ролях (SingleBinary): стенд тестовый, масштабировать нечего.

stream_over_http_enabled: true

server:
  http_listen_port: 3200
  log_level: info

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

ingester:
  # Блок закрывается через пять минут, а не через час: без этого свежая трасса ищется
  # только в памяти, и после перезапуска Tempo её не найти.
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 24h

# Генератор метрик — то, ради чего в стенде вообще есть Tempo сверх поиска трасс:
# из спанов он делает RED-метрики (span-metrics) и карту сервисов (service-graphs)
# и пишет их в Prometheus. Хаб при этом ни того, ни другого не считает.
metrics_generator:
  registry:
    external_labels:
      source: tempo
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        # Экземпляры (exemplars) — единственный способ прыгнуть из точки графика
        # в трассу: в них едет trace_id.
        send_exemplars: true
  processor:
    span_metrics:
      # Меткой едут атрибуты, по которым режется дашборд хаба.
      dimensions:
        - http.request.method
        - http.route
        - http.response.status_code
      histogram_buckets: [0.005, 0.01, 0.025, 0.05, 0.1, 0.25, 0.5, 1, 2.5, 5, 10]
    service_graphs:
      dimensions:
        - http.request.method

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

# Генератор выключен по умолчанию и включается переопределением на арендатора.
# Арендатор здесь один — anonymous, поэтому переопределение общее.
overrides:
  defaults:
    metrics_generator:
      processors:
        - span-metrics
        - service-graphs
