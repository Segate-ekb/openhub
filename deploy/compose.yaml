# OpenHub на одном сервере (linux/amd64): docker compose up -d, затем http://127.0.0.1:3333/setup.
# Настройки — в autumn-properties.json рядом; здесь только база и секреты.
# Наружу хаб выставляется только за обратным прокси с TLS.

name: openhub-server

services:
  openhub:
    image: segateekb/openhub:0.7.23
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:3333:3333"
    environment:
      TZ: UTC
      OSHUB_DB_CONNECTOR: КоннекторPostgreSQL
      # Пароль тот же, что у сервиса postgres, и без «;» внутри. Меняется до первого запуска:
      # после инициализации тома базы правка здесь пароль в ней уже не сменит.
      OSHUB_DB_CONNECTION: Host=postgres;Username=openhub;Password=change-me;Database=openhub
      # Ключи S3 — при oshub.storage.backend = s3.
      #OSHUB_STORAGE_S3_ACCESS_KEY:
      #OSHUB_STORAGE_S3_SECRET_KEY:
      # Если коллектор требует авторизацию.
      #OTEL_EXPORTER_OTLP_HEADERS: Authorization=Bearer ...
    volumes:
      # Журнал аудита и, при backend = file, файлы пакетов.
      - openhub-data:/var/lib/openhub
      - ./autumn-properties.json:/opt/openhub/autumn-properties.json:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3333/ready"]
      interval: 30s
      timeout: 5s
      start_period: 120s
      retries: 3

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: openhub
      POSTGRES_DB: openhub
      POSTGRES_PASSWORD: change-me
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openhub -d openhub"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  openhub-data:
  postgres-data:
