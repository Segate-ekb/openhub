# Тесты OpenHub по уровням прогона (уровни и теги — docs/разработка.md).
#
#   смоук     — на каждое событие: минимум, доказывающий, что хаб работает по назначению,
#               включая полный цикл `opm push` → `opm install` против живого хаба;
#   регрессия — на всём, кроме pull request (push в main, ручной запуск): всё дерево, кроме
#               наборов, которым нужна внешняя система (MinIO/S3, PostgreSQL, живой hub.oscript.io).
#
# Шаги повторяют reusable workflow autumn-library/workflows (те же actions и версии),
# но наборы разложены по подкаталогам tests/: регрессия идёт через scripts/тесты.sh --всё --параллельно
# (всё дерево файлами, тег «внешние» исключён; корзин на одну меньше, чем ядер раннера, плюс корзина
# «хабы», веса — таблица раннера scripts/время-наборов-ci.tsv; docs/разработка.md, «Тесты»),
# смоук — через scripts/смоук.sh.
#
# Ручной запуск с time_table вместо регрессии корзинами гоняет наборы по одному
# (--время) и выкладывает новую scripts/время-наборов-ci.tsv артефактом «время-наборов-ci».
#
# Зависимости ставит `opm install -l` из корня репозитория: источники — opm.cfg рядом
# с packagedef (основной пул hub.oscript.io, за ним пул segate-ekb).
name: Тестирование

# push только на main + pull_request — без двойных прогонов для веток с PR
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      time_table:
        description: Наборы по одному вместо корзин; таблица весов scripts/время-наборов-ci.tsv — артефактом
        type: boolean
        default: false

jobs:

  smoke:
    name: Смоук
    runs-on: ubuntu-latest
    steps:
      - name: Актуализация
        uses: actions/checkout@v7.0.1

      - name: Установка OneScript
        # Тот же выпуск, что в базовом образе хаба (docker/Dockerfile, ARG ONESCRIPT_IMAGE).
        uses: otymko/setup-onescript@v1.5.1
        with:
          version: 2.2.1

      - name: Установка зависимостей
        # Версии зависимостей держит packagedef.
        run: |
          opm install opm
          opm install -l --dev

      - name: Установка OneUnit
        # Глобально, а не `-l`: scripts/смоук.sh зовёт oneunit из PATH.
        run: opm install oneunit@0.4.1

      - name: Сборка пакета
        run: opm build .

      - name: Смоук OneUnit
        # Скриптом, а не `oneunit execute -t смоук`: прямая команда не отбирает наборы
        # с &Изолированный(Уровень = "Процесс") — см. scripts/смоук.sh
        run: scripts/смоук.sh

  regression:
    name: Регрессия
    # Всё, кроме наборов, которым нужна внешняя система; не на pull request. Хаб
    # поднимается тестом на localhost, база — КоннекторJSON.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    services:
      # SQL-ветку агрегатов исполняет только PostgreSQL: КоннекторJSON SQL не исполняет.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: openhub
          POSTGRES_PASSWORD: openhub
          POSTGRES_DB: openhub
        ports:
          - 15432:5432
        options: >-
          --health-cmd "pg_isready -U openhub"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Актуализация
        uses: actions/checkout@v7.0.1

      - name: Установка OneScript
        # Тот же выпуск, что в базовом образе хаба (docker/Dockerfile, ARG ONESCRIPT_IMAGE).
        uses: otymko/setup-onescript@v1.5.1
        with:
          version: 2.2.1

      - name: Установка зависимостей
        run: |
          opm install opm
          opm install -l --dev

      - name: Установка OneUnit
        run: opm install oneunit@0.4.1

      - name: Регрессия OneUnit (без наборов, требующих внешних систем)
        # Скриптом: наборы лежат по подкаталогам tests/, а `oneunit execute` без -f смотрит
        # только в корень tests/ — см. scripts/тесты.sh. Наборы без общего хаба — в N корзин
        # по весам раннера scripts/время-наборов-ci.tsv, наборы групп хабов — корзиной «хабы»
        # одновременно с ними: N на одну меньше числа ядер, чтобы корзина «хабы» шла на своём
        # (на двух ядрах и меньше — по числу ядер).
        if: ${{ !inputs.time_table }}
        run: |
          N="$(nproc)"
          if [ "$N" -gt 2 ]; then N=$((N - 1)); fi
          scripts/тесты.sh --всё --параллельно "$N" --веса scripts/время-наборов-ci.tsv

      - name: Таблица времени наборов на раннере
        # Каждый набор своим oneunit; итог — таблица весов корзин CI целиком, упавшему набору —
        # строка прежней таблицы.
        if: ${{ inputs.time_table }}
        run: scripts/тесты.sh --всё --время --таблица-времени scripts/время-наборов-ci.tsv

      - name: Выгрузка таблицы времени
        # Владелец скачивает артефакт и коммитит файл в scripts/.
        if: ${{ !cancelled() && inputs.time_table }}
        uses: actions/upload-artifact@v4.6.2
        with:
          name: время-наборов-ci
          path: scripts/время-наборов-ci.tsv

      - name: Наборы на живом PostgreSQL
        # Поимённо и с DSN: без OSHUB_TEST_PG_DSN оба набора пропускают свои тесты.
        env:
          OSHUB_TEST_PG_DSN: Host=localhost;Port=15432;Username=openhub;Password=openhub;Database=openhub
        run: oneunit execute -f tests/внешние/АгрегатыPostgreSQL_Тесты.os -f tests/внешние/СмокБэкендов_Тесты.os

      - name: Карантин OneUnit (плавающие под нагрузкой)
        # Наборы *_Плавающие_Тесты.os регрессия не берёт: красное здесь видно, но конвейер не роняет.
        continue-on-error: true
        run: scripts/тесты.sh --плавающие
